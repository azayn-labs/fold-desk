<!doctype html>
<html><head><meta charset="utf-8"><title>FoldDesk v0.1.6</title>
<style>
  :root { --text:#fafafa; --subtle:#a8a8ad; --accent:#3e91ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1760px; height:971px; overflow:hidden; display:flex; gap:10px; background:#000; color:var(--text); font-family:"SamsungOne",Roboto,system-ui,sans-serif; }
  .screen { position:relative; width:875px; height:971px; overflow:hidden;
    background: radial-gradient(700px 520px at 78% 22%, rgba(97,150,255,.55), transparent 65%), radial-gradient(640px 520px at 20% 85%, rgba(54,196,214,.35), transparent 60%), linear-gradient(155deg,#0f2c63,#07122a); }
  .cap { position:absolute; left:14px; top:34px; font-size:13px; color:#ffd76a; background:rgba(0,0,0,.6); padding:4px 9px; border-radius:6px; z-index:9; }
  .status { position:absolute; left:0; right:0; top:0; height:26px; display:flex; justify-content:space-between; padding:5px 16px; font-size:12px; }
  .icons { position:absolute; left:18px; top:90px; display:grid; grid-template-rows:repeat(4,92px); gap:6px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11.5px; width:72px; } .tile i { width:46px; height:46px; border-radius:14px; }
  .taskbar { position:absolute; left:0; right:0; bottom:0; height:48px; background:rgba(28,28,30,.62); backdrop-filter:blur(24px); display:flex; align-items:center; gap:8px; padding:0 12px; }
  .taskbar i { width:30px; height:30px; border-radius:9px; } .taskbar .tray { margin-left:auto; font-size:12px; text-align:right; line-height:1.25; }
  .dots { width:30px; height:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:6px; } .dots b { background:#fafafa; border-radius:50%; }
  /* the notice */
  .notice { position:absolute; left:50%; transform:translateX(-50%); bottom:64px; width:560px; display:flex; align-items:center; gap:14px;
    background:rgba(38,38,42,.82); backdrop-filter:blur(30px); border-radius:22px; padding:14px 14px 14px 18px; box-shadow:0 10px 34px rgba(0,0,0,.45); }
  .notice .ic { width:36px; height:36px; border-radius:18px; background:rgba(255,159,10,.18); color:#ff9f0a; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; flex:none; }
  .notice .t { flex:1; font-size:14px; line-height:1.35; } .notice .t small { display:block; color:var(--subtle); font-size:12.5px; margin-top:2px; }
  .notice .btn { background:var(--accent); color:#fff; font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:18px; flex:none; }
  .notice .x { color:var(--subtle); font-size:18px; padding:4px 6px; flex:none; }
  .note { position:absolute; font-size:12.5px; color:#cfe1ff; background:rgba(0,0,0,.6); padding:6px 10px; border-radius:6px; line-height:1.45; }
  /* settings row */
  .page { position:absolute; left:60px; top:90px; width:600px; background:#0c0c0e; border-radius:14px; padding:14px 18px 20px; box-shadow:0 16px 48px rgba(0,0,0,.55); }
  .gt { font-size:13px; color:var(--accent); font-weight:600; margin:14px 12px 8px; }
  .card { background:#1c1c1f; border-radius:22px; overflow:hidden; }
  .row { display:flex; align-items:center; padding:13px 20px; min-height:60px; font-size:15px; gap:14px; }
  .row .t { flex:1; } .row small { display:block; font-size:12.5px; margin-top:3px; color:var(--subtle); }
  .dot { width:8px; height:8px; border-radius:4px; display:inline-block; margin-right:6px; }
</style></head><body>
<div class="screen" id="a"></div><div class="screen" id="b"></div>
<script>
const col = ['#1a73e8','#25d366','#d6249f','#ff0033','#f4b400','#0f9d58','#7e57c2','#ff7043'];
const names = ['Browser','Messages','Gallery','Video','Notes','Maps','Music','Photos'];
const status = `<div class="status"><span>09:41</span><span>84%</span></div>`;
const bar = `<div class="taskbar"><div class="dots">${'<b></b>'.repeat(9)}</div>${col.slice(0,6).map(c=>`<i style="background:${c}"></i>`).join('')}<div class="tray">09:41<br>Wed, Oct 28</div></div>`;
a.innerHTML = `${status}<div class="cap">1 · Desktop, when the taskbar service is off</div>
<div class="icons">${names.slice(0,4).map((n,i)=>`<div class="tile"><i style="background:${col[i]}"></i>${n}</div>`).join('')}</div>
<div class="notice"><div class="ic">!</div>
  <div class="t">The FoldDesk taskbar is turned off<small>Without it the app drawer opens behind apps and unfolding won't bring you back here</small></div>
  <div class="btn">Turn on</div><div class="x">✕</div></div>
${bar}
<div class="note" style="left:157px;top:520px;width:560px">"Turn on" opens Settings → Accessibility → FoldDesk taskbar.<br>✕ hides it until the service stops again. Disappears by itself once the service is running.</div>`;
b.innerHTML = `${status}<div class="cap">2 · FoldDesk settings → Status (existing row, now tappable)</div>
<div class="page"><div class="gt">Status</div><div class="card">
  <div class="row"><div class="t">Taskbar service<small>Off · tap to turn it on in Accessibility settings</small></div><span style="font-size:13px;color:#ff9f0a"><span class="dot" style="background:#ff9f0a"></span>Off</span></div>
</div></div>
<div class="note" style="left:60px;top:270px;width:600px">Same wording and colour as the desktop notice. When running it stays as it is today: green dot, "Running".</div>`;
</script></body></html>
