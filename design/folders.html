<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Desktop folders</title>
<style>
  :root { --bar: rgba(12,12,14,.86); --panel: rgba(38,38,42,.95); --menu: #2b2b2f; --hover: rgba(255,255,255,.12);
    --accent: #3e91ff; --text: #fafafa; --subtle: #a8a8ad; --divider: rgba(255,255,255,.1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 875px; height: 971px; overflow: hidden; color: var(--text); font-family: "SamsungOne", Roboto, system-ui, sans-serif; }
  .screen { position: relative; width: 875px; height: 971px; overflow: hidden;
    background: radial-gradient(700px 520px at 78% 22%, rgba(97,150,255,.55), transparent 65%),
      radial-gradient(640px 520px at 20% 85%, rgba(54,196,214,.35), transparent 60%),
      linear-gradient(155deg, #0f2c63 0%, #0b1b3d 55%, #07122a 100%); }
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: var(--bar); display: flex; align-items: center; padding: 0 6px; z-index: 30; }
  .key { width: 44px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .key svg { width: 22px; height: 22px; }
  .vsep { width: 1px; height: 22px; background: rgba(255,255,255,.18); margin: 0 6px; }
  .app { width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; }
  .tray { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12.5px; padding-right: 10px; }
  .clock { text-align: right; line-height: 1.25; } .clock small { display: block; font-size: 11px; color: #d6d6da; }

  .ico { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #fff; flex: none; }
  .ico.s20 { width: 20px; height: 20px; border-radius: 6px; font-size: 10px; }
  .ico.s24 { width: 24px; height: 24px; border-radius: 7px; font-size: 11px; }
  .ico.s48 { width: 48px; height: 48px; border-radius: 15px; font-size: 20px; }
  .tile { position: absolute; width: 84px; height: 98px; display: flex; flex-direction: column; align-items: center; padding: 8px 2px 6px; border-radius: 12px; }
  .tile span { margin-top: 5px; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.8); white-space: nowrap; }
  .tile.ghost { opacity: .35; }
  .tile.lift { background: rgba(255,255,255,.2); transform: scale(1.08); box-shadow: 0 10px 24px rgba(0,0,0,.45); z-index: 5; }
  /* the icon being dropped on: ring + soft glow says "this will become a folder" */
  .tile.target { background: rgba(255,255,255,.16); box-shadow: 0 0 0 2px var(--accent), 0 0 24px rgba(62,145,255,.55); transform: scale(1.08); }

  /* folder icon: glass square with up to four mini icons */
  .fold { width: 48px; height: 48px; border-radius: 15px; padding: 5px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 3px;
    background: rgba(255,255,255,.24); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
  .fold .ico { width: 100%; height: auto; aspect-ratio: 1; border-radius: 6px; font-size: 9px; }
  .fold.sm { width: 32px; height: 32px; padding: 3px; gap: 2px; border-radius: 10px; }
  .fold.sm .ico { border-radius: 4px; font-size: 0; }
  .fold .more { border-radius: 6px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 9px; }

  .finger { position: absolute; width: 34px; height: 34px; border-radius: 17px; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.7); z-index: 9; }
  .tag { position: absolute; font-size: 11.5px; color: #ffd76a; background: rgba(0,0,0,.65); padding: 4px 9px; border-radius: 6px; line-height: 1.4; z-index: 40; }
  .scrim { position: absolute; inset: 0 0 48px 0; background: rgba(0,0,0,.28); z-index: 10; }

  /* folder panel */
  .folder { position: absolute; width: 440px; border-radius: 28px; background: var(--panel); box-shadow: 0 20px 60px rgba(0,0,0,.55); padding: 18px 18px 14px; z-index: 20; }
  .folder .title { display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; font-size: 17px; font-weight: 600; }
  .folder .title svg { width: 16px; height: 16px; opacity: .6; }
  .folder .grid { position: relative; margin-top: 10px; height: 220px; }
  .folder .grid .tile { position: absolute; }
  .folder .hint { text-align: center; font-size: 11.5px; color: var(--subtle); padding-top: 4px; }
  .edit { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,255,255,.1);
    box-shadow: inset 0 -2px 0 var(--accent); font-size: 17px; font-weight: 600; min-width: 200px; }
  .caret { width: 2px; height: 20px; background: var(--accent); margin-left: -6px; }
  .done { width: 36px; height: 36px; border-radius: 18px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .done svg { width: 18px; height: 18px; }
  .kbd { position: absolute; left: 0; right: 0; bottom: 48px; height: 300px; background: #1b1b1f; border-top: 1px solid var(--divider); z-index: 25;
    display: flex; flex-direction: column; gap: 10px; padding: 18px 14px; }
  .kbd .row { display: flex; gap: 6px; justify-content: center; }
  .kbd .row i { flex: 1; max-width: 70px; height: 46px; border-radius: 8px; background: #2d2d33; }
  .kbd .row i.w { max-width: 380px; flex: 4; }

  .ctx { position: absolute; width: 240px; background: var(--menu); border-radius: 22px; padding: 8px 0; box-shadow: 0 10px 34px rgba(0,0,0,.55); z-index: 22; }
  .ctx > div { padding: 10px 22px; font-size: 14px; display: flex; justify-content: space-between; }
  .ctx > div.h { background: var(--hover); }
  .ctx hr { border: 0; border-top: 1px solid var(--divider); margin: 4px 16px; }
  .ctx .head { font-weight: 600; justify-content: flex-start; gap: 10px; align-items: center; }

  /* large folder: 2x2 cells, apps launch straight from the desktop */
  .big { position: absolute; width: 168px; height: 196px; border-radius: 28px; background: rgba(255,255,255,.2);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); padding: 10px 6px 0; }
  .big .nm { text-align: center; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.8); height: 18px; }
  .big .g { position: relative; height: 170px; }
  .big .g .tile { padding-top: 6px; }
  .big .plus { width: 48px; height: 48px; border-radius: 15px; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
  .sub { position: absolute; width: 190px; background: var(--menu); border-radius: 18px; padding: 6px 0; box-shadow: 0 10px 34px rgba(0,0,0,.55); z-index: 23; }
  .sub div { padding: 10px 20px; font-size: 14px; display: flex; justify-content: space-between; }
  .sub div.h { background: var(--hover); }
  .sizeico { display: inline-block; border: 1.5px solid #fafafa; border-radius: 3px; vertical-align: -3px; margin-right: 8px; }
  .cellbox { position: absolute; border: 1px dashed rgba(255,255,255,.3); border-radius: 12px; }
</style>
</head>
<body>
<div class="screen" id="s"></div>
<script>
  const st = new URLSearchParams(location.search).get('s') || 'drag';
  const A = {
    wa: ['WhatsApp', '#25d366', '✆'], ig: ['Instagram', '#d6249f', '◎'], fb: ['Facebook', '#1877f2', 'f'],
    yt: ['YouTube', '#ff0033', '▶'], co: ['Calendar', '#4d7cf4', '31'], ch: ['Chrome', '#e8a21a', 'C'],
  };
  const ico = (k, c = '') => `<div class="ico ${c}" style="background:${A[k][1]}">${A[k][2]}</div>`;
  const tile = (k, x, y, cls = '') => `<div class="tile ${cls}" style="left:${x}px;top:${y}px">${ico(k, 's48')}<span>${A[k][0]}</span></div>`;
  const folder = (name, keys, x, y, cls = '') => `<div class="tile ${cls}" style="left:${x}px;top:${y}px">
      <div class="fold">${keys.slice(0, 4).map(k => ico(k, 's20')).join('')}</div><span>${name}</span></div>`;
  const pencil = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  const big = (name, keys, x, y, extra = 0) => `<div class="big" style="left:${x}px;top:${y}px"><div class="nm">${name}</div><div class="g">
      ${keys.slice(0, extra ? 3 : 4).map((k, i) => tile(k, (i % 2) * 78, Math.floor(i / 2) * 84)).join('')}
      ${extra ? `<div class="tile" style="left:78px;top:84px"><div class="plus">+${extra}</div><span>More</span></div>` : ''}</div></div>`;
  const bar = `<div class="taskbar">
      <div class="key"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg></div>
      <div class="vsep"></div>${['ch', 'co'].map(k => `<div class="app">${ico(k)}</div>`).join('')}
      <div class="tray"><span>84%</span><div class="clock">13:55<small>Tue, Oct 27</small></div></div></div>`;

  // Desktop column, as on the real desktop: icons from the top-left.
  const col = (skip = []) => [['wa'], ['ig'], ['fb'], ['yt']].map(([k], i) => skip.includes(k) ? '' : tile(k, 10, 14 + i * 98)).join('');
  let body = '';

  if (st === 'drag') {
    // Instagram dragged onto WhatsApp.
    body = `${tile('wa', 10, 14, 'target')}${tile('ig', 10, 112, 'ghost')}${tile('fb', 10, 210)}${tile('yt', 10, 308)}
      ${tile('ig', 44, 60, 'lift')}<div class="finger" style="left:69px;top:84px"></div>
      <div class="tag" style="left:150px;top:30px">1 · Drag an icon so it sits over another one.<br>The icon underneath lights up: letting go now makes a folder.<br>Hover only the edge and it still swaps places, as today.</div>`;
  } else if (st === 'created') {
    body = `${folder('Folder', ['wa', 'ig'], 10, 14)}${tile('fb', 10, 112)}${tile('yt', 10, 210)}
      <div class="tag" style="left:120px;top:42px">2 · A folder appears where the icon was, called "Folder".<br>It shows up to four apps; with more it ends in "+3".</div>
      ${folder('Folder', ['wa', 'ig', 'fb', 'yt'], 10, 340)}
      <div class="tag" style="left:120px;top:370px">Dropping another icon on a folder adds it.</div>`;
  } else if (st === 'open') {
    body = `${folder('Social', ['wa', 'ig', 'fb'], 10, 14, 'target')}${tile('yt', 10, 112)}<div class="scrim"></div>
      <div class="folder" style="left:217px;top:290px">
        <div class="title">Social ${pencil}</div>
        <div class="grid" style="height:112px">${tile('wa', 36, 0)}${tile('ig', 136, 0)}${tile('fb', 236, 0)}</div>
        <div class="hint">Tap the name to rename · drag an app out to put it back on the desktop</div>
      </div>
      <div class="tag" style="left:217px;top:240px">3 · Tap a folder to open it. Tap an app to launch it (window, as usual).</div>`;
  } else if (st === 'rename') {
    body = `${folder('Social', ['wa', 'ig', 'fb'], 10, 14)}${tile('yt', 10, 112)}<div class="scrim"></div>
      <div class="folder" style="left:217px;top:110px">
        <div class="title" style="gap:12px"><div class="edit">Social<div class="caret"></div></div><div class="done">${check}</div></div>
        <div class="grid" style="height:130px">${tile('wa', 36, 0)}${tile('ig', 136, 0)}${tile('fb', 236, 0)}</div>
      </div>
      <div class="kbd"><div class="row">${'<i></i>'.repeat(10)}</div><div class="row">${'<i></i>'.repeat(9)}</div><div class="row">${'<i></i>'.repeat(7)}</div><div class="row"><i></i><i class="w"></i><i></i></div></div>
      <div class="tag" style="left:217px;top:60px">4 · Tap the name (or the pencil) to rename. The panel slides up above the keyboard; ✓ or Enter saves.</div>`;
  } else if (st === 'menu') {
    body = `${folder('Social', ['wa', 'ig', 'fb'], 10, 14, 'lift')}${tile('yt', 10, 210)}
      <div class="ctx" style="left:100px;top:60px">
        <div class="head"><div class="fold sm">${['wa', 'ig', 'fb'].map(k => ico(k, '')).join('')}</div>Social</div><hr>
        <div>Open</div><div class="h">Rename</div><hr>
        <div>Ungroup</div><div>Remove from desktop</div></div>
      <div class="tag" style="left:350px;top:70px">5 · Long-press / right-click a folder.<br><b>Ungroup</b> puts its apps back on the desktop;<br><b>Remove from desktop</b> takes the folder and its<br>apps off (they stay in the drawer).</div>`;
  } else if (st === 'size') {
    body = `${folder('Social', ['wa', 'ig', 'fb', 'yt'], 10, 14, 'lift')}${tile('co', 10, 210)}
      <div class="ctx" style="left:100px;top:60px">
        <div class="head"><div class="fold sm">${['wa', 'ig', 'fb', 'yt'].map(k => ico(k, '')).join('')}</div>Social</div><hr>
        <div>Open</div><div>Rename</div><div class="h">Folder size <span>›</span></div><hr>
        <div>Ungroup</div><div>Remove from desktop</div></div>
      <div class="sub" style="left:345px;top:162px">
        <div class="h"><span><i class="sizeico" style="width:10px;height:10px"></i>Small · 1×1</span><span style="color:var(--accent)">✓</span></div>
        <div><span><i class="sizeico" style="width:15px;height:15px;vertical-align:-4px"></i>Large · 2×2</span></div></div>
      <div class="tag" style="left:345px;top:70px;width:300px">6 · "Folder size" in the folder menu: Small is the icon from before, Large shows the apps on the desktop.</div>`;
  } else if (st === 'large') {
    body = `${big('Social', ['wa', 'ig', 'fb', 'yt'], 10, 14)}${tile('co', 10, 220)}${tile('ch', 10, 318)}
      ${big('Work', ['co', 'ch', 'wa', 'ig', 'fb', 'yt'], 200, 14, 3)}
      <div class="tag" style="left:200px;top:224px;width:330px">7 · Large folder: 2×2 cells. Tap an app to launch it right here, tap the name or empty space to open the full panel.<br>With more than 3 apps the last slot becomes "+N" and opens the panel.</div>
      <div class="tag" style="left:200px;top:310px;width:330px">Icons in the way shift to the nearest free cell, the same as around widgets. If there's no room for 2×2, Large is greyed out.</div>`;
  }
  document.getElementById('s').innerHTML = body + bar;
</script>
</body>
</html>
