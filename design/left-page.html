<!doctype html>
<html><head><meta charset="utf-8"><title>FoldDesk page left of desktop 1</title>
<style>
  :root { --bg:#0c0c0e; --card:#1c1c1f; --accent:#3e91ff; --text:#fafafa; --subtle:#9a9aa0; --divider:rgba(255,255,255,.08); --row:rgba(22,22,28,.62); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1180px; height:1500px; overflow:hidden; display:grid; grid-template-columns:560px 560px; gap:20px; padding:20px; background:#111; color:var(--text); font-family:"SamsungOne",Roboto,system-ui,sans-serif; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .cap { font-size:14px; color:#ffd76a; min-height:22px; }
  .note { font-size:12.5px; color:#cfe1ff; line-height:1.45; }
  .scr { position:relative; width:560px; height:620px; border-radius:26px; overflow:hidden; }
  .wall { position:absolute; inset:0; background: radial-gradient(360px 300px at 78% 18%, rgba(118,150,255,.55), transparent 65%), radial-gradient(380px 360px at 12% 92%, rgba(54,196,214,.38), transparent 60%), linear-gradient(160deg,#1b2650,#0b1022 60%,#120c25); }
  .pageBg { position:absolute; inset:0; background:rgba(8,9,14,.55); backdrop-filter:blur(18px); }
  .bar { position:absolute; left:0; right:0; bottom:0; height:40px; background:rgba(16,17,21,.86); display:flex; align-items:center; gap:9px; padding:0 12px; z-index:5; }
  .bar i { width:22px; height:22px; border-radius:7px; display:block; }
  .status { position:absolute; top:0; left:0; right:0; height:24px; display:flex; justify-content:space-between; align-items:center; padding:0 14px; font-size:11px; color:#e3e6ee; z-index:4; }
  .ic { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; flex:none; }
  .ic.s { width:24px; height:24px; border-radius:7px; font-size:10px; }
  .search { height:40px; border-radius:20px; background:rgba(255,255,255,.12); display:flex; align-items:center; gap:10px; padding:0 16px; font-size:14px; color:var(--subtle); }
  .search .glass { width:12px; height:12px; border:2px solid var(--subtle); border-radius:7px; }
  .sec { font-size:11px; color:rgba(255,255,255,.8); display:flex; justify-content:space-between; padding:0 4px 6px; }
  .tile { border-radius:16px; background:var(--row); padding:10px 12px; }
  .nrow { display:flex; gap:10px; align-items:center; padding:7px 0; font-size:12px; }
  .nrow .t { font-weight:600; } .nrow .d { color:var(--subtle); font-size:11px; }
  .ev { display:flex; gap:10px; font-size:12px; padding:5px 0; } .ev b { color:var(--accent); font-weight:600; width:38px; }
  .apps { display:flex; justify-content:space-between; }
  .app { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; color:#e6e8ef; width:52px; }
  .suggest { border-radius:16px; border:1.5px dashed rgba(255,255,255,.28); padding:14px; text-align:center; font-size:12px; color:#dfe3ec; }
  .btn { display:inline-block; margin-top:9px; padding:7px 14px; border-radius:16px; background:var(--accent); color:#fff; font-weight:600; font-size:12px; }
  .w { border-radius:16px; background:rgba(240,243,250,.95); color:#222; padding:10px 12px; font-size:12px; }
  .dot { position:absolute; display:flex; gap:5px; left:50%; transform:translateX(-50%); top:30px; z-index:4; }
  .dot i { width:6px; height:6px; border-radius:3px; background:rgba(255,255,255,.35); } .dot i.on { width:14px; background:#fff; }
  .finger { position:absolute; width:40px; height:40px; border-radius:20px; background:rgba(255,255,255,.35); border:2px solid #fff; z-index:6; }
  .set { width:560px; height:620px; border-radius:26px; background:var(--bg); padding:24px 16px; position:relative; overflow:hidden; }
  .set h1 { font-size:24px; font-weight:600; padding:10px 8px 14px; }
  .g { font-size:12.5px; color:var(--accent); padding:12px 10px 6px; }
  .card { border-radius:20px; background:var(--card); }
  .row { display:flex; justify-content:space-between; align-items:center; padding:13px 18px; font-size:15px; } .row + .row { border-top:1px solid var(--divider); }
  .row small { display:block; color:var(--accent); font-size:12.5px; margin-top:3px; }
  .dim { position:absolute; inset:0; background:rgba(0,0,0,.5); }
  .sheet { position:absolute; left:10px; right:10px; bottom:10px; border-radius:24px; background:#2b2b2f; padding:20px 20px 10px; }
  .sheet h2 { font-size:18px; } .sheet p { font-size:12.5px; color:#cfd2d8; margin-top:4px; }
  .opt { display:flex; align-items:center; gap:12px; padding:12px 2px; border-top:1px solid var(--divider); font-size:15px; }
  .opt:first-of-type { margin-top:10px; } .opt small { display:block; font-size:12px; color:var(--subtle); margin-top:2px; }
  .radio { width:20px; height:20px; border-radius:10px; border:2px solid #777; margin-left:auto; flex:none; }
  .radio.on { border-color:var(--accent); background:radial-gradient(circle,var(--accent) 45%,transparent 50%); }
  .tag { font-size:10px; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:1px 5px; margin-left:6px; }
</style></head><body>
<script>
const C = { mail:'#e5484d', notes:'#f5a524', web:'#3e91ff', music:'#9b5cf6', photos:'#ff7a59', files:'#d4a017', cal:'#1f9d68', chat:'#25b45e', maps:'#0fa3b1' };
const L = { mail:'M', notes:'N', web:'W', music:'♪', photos:'P', files:'F', cal:'31', chat:'C', maps:'➤' };
const N = { mail:'Mail', notes:'Notes', web:'Browser', music:'Music', photos:'Photos', files:'Files', cal:'Calendar', chat:'Chat', maps:'Maps' };
const ic = (k, s='') => `<div class="ic ${s}" style="background:${C[k]}">${L[k]}</div>`;
const bar = `<div class="bar">${['#3e91ff','#e5484d','#25b45e','#9b5cf6','#d4a017'].map(c=>`<i style="background:${c}"></i>`).join('')}</div>`;
const status = `<div class="status"><span>12:00</span><span>▮▮ 78%</span></div>`;

const leftCol = `
  <div class="sec"><span>Today</span><span>Calendar</span></div>
  <div class="tile"><div class="ev"><b>09:00</b>Team stand-up</div><div class="ev"><b>13:30</b>Lunch with Sam</div><div class="ev" style="color:var(--subtle)"><b style="color:var(--subtle)">Tmrw</b>Dentist, 10:00</div></div>
  <div class="sec" style="margin-top:12px"><span>Notifications</span><span>3</span></div>
  <div class="tile">
    <div class="nrow">${ic('chat','s')}<div><div class="t">Sam</div><div class="d">See you at 1:30?</div></div></div>
    <div class="nrow">${ic('mail','s')}<div><div class="t">Weekly report</div><div class="d">Your summary is ready</div></div></div>
    <div class="nrow">${ic('music','s')}<div><div class="t">New release</div><div class="d">From an artist you follow</div></div></div>
  </div>`;
const recent = `<div class="sec"><span>Recent</span></div><div class="tile"><div class="apps">${['web','mail','notes','maps','photos'].map(k=>`<div class="app">${ic(k)}${N[k]}</div>`).join('')}</div></div>`;

const page = (widgets) => `<div class="scr"><div class="wall"></div><div class="pageBg"></div>${status}
  <div class="dot"><i class="on"></i><i></i></div>
  <div style="position:absolute;left:22px;right:22px;top:50px;z-index:3">
    <div class="search"><span class="glass"></span>Search apps and the web</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px">
      <div>${leftCol}</div>
      <div>${recent}
        <div style="margin-top:12px">${widgets ? `
          <div class="sec"><span>Widgets</span><span>Edit</span></div>
          <div class="w" style="display:flex;align-items:center;gap:8px;border-radius:22px"><b style="color:#4285f4;font-size:15px">G</b><span style="color:#666">Search</span><span style="margin-left:auto;color:#888">🎤</span></div>
          <div class="w" style="margin-top:8px"><div style="font-size:11px;color:#666">Saturday, Oct 31</div><div style="font-size:22px;margin-top:2px">18° ☁️</div><div style="color:#666;font-size:11px">Placeholder City</div></div>
          <div class="w" style="margin-top:8px"><div style="font-size:11px;color:#666">Top stories</div><div style="margin-top:5px">• Placeholder headline one</div><div>• Placeholder headline two</div></div>`
        : `<div class="suggest">Add widgets here: Google search, weather, news…<br><span class="btn">Add suggested widgets</span><div style="color:var(--subtle);font-size:11px;margin-top:8px">or hold an empty spot to pick your own</div></div>`}
        </div>
      </div>
    </div>
  </div>${bar}</div>`;

// 1 · the setting
const settings = `<div class="set"><h1>FoldDesk settings</h1><div class="g">Gestures</div><div class="card">
   <div class="row" style="opacity:.35">Swipe to switch desktops</div>
   <div class="row">Swipe right on the first desktop<span></span></div></div>
  <div class="dim"></div><div class="sheet"><h2>Swipe right on the first desktop</h2><p>On an empty part of the desktop</p>
   <div class="opt"><div>Nothing</div><span class="radio"></span></div>
   <div class="opt"><div>Today page<span class="tag">NEW</span><small>Your day, notifications and widgets, left of desktop 1</small></div><span class="radio on"></span></div>
   <div class="opt"><div>Open an app<small>Full screen, e.g. the Google app for Discover</small></div><span style="color:var(--accent);font-size:13px;margin-left:auto">Choose ›</span></div>
   <div style="text-align:right;color:var(--accent);font-weight:600;padding:10px 6px 4px">Cancel</div></div></div>`;

// 2 · mid-swipe: the page follows the finger
const swipe = `<div class="scr">
  <div style="position:absolute;inset:0;transform:translateX(260px)"><div class="wall"></div>${status}
     ${['mail','notes','web','music'].map((k,i)=>`<div style="position:absolute;left:${24+(i%2)*62}px;top:${50+Math.floor(i/2)*70}px">${ic(k)}</div>`).join('')}
     <div style="position:absolute;left:14px;top:30px;font-size:11px;color:#cfd8ff;opacity:0">.</div></div>
  <div style="position:absolute;top:0;bottom:0;left:-300px;width:560px;overflow:hidden"><div class="wall"></div><div class="pageBg"></div>
     <div style="position:absolute;left:22px;right:22px;top:50px"><div class="search"><span class="glass"></span>Search apps and the web</div>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px"><div>${leftCol}</div><div>${recent}</div></div></div></div>
  <div class="finger" style="left:240px;top:330px"></div>
  <div style="position:absolute;left:150px;top:300px;font-size:13px;color:#fff;z-index:6">→</div>
  ${bar}</div>`;

const cells = [
  ['1 · Settings → Gestures → Swipe right on the first desktop', settings, 'Three choices: Nothing (default), the new Today page, or Open an app (what\'s built now: full screen, e.g. Google for Discover).'],
  ['2 · Swiping right on desktop 1: the page follows your finger', swipe, 'It\'s part of FoldDesk, so it tracks the finger both ways, snaps open past halfway and slides back otherwise. Swiping left anywhere on the page goes back to desktop 1. Pages dots show where you are.'],
  ['3 · The page out of the box (no setup)', page(false), 'A search bar (keyboard on tap, or at once with "Open keyboard with app drawer"): apps first, Go searches the web in your browser or the Google app. Your day from the calendar, notifications one row per app, recent apps. Same building blocks as the cover screen.'],
  ['4 · After "Add suggested widgets"', page(true), 'One tap adds the Google search bar, a weather and a news widget if those apps are installed. Android asks "Allow FoldDesk to access widgets?" once per app. Hold an empty spot to add, move or remove widgets, like on the cover screen\'s widget page.'],
];
document.body.innerHTML = cells.map(([t,s,n]) => `<div class="col"><div class="cap">${t}</div>${s}<div class="note">${n}</div></div>`).join('');
</script></body></html>
