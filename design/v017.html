<!doctype html>
<html><head><meta charset="utf-8"><title>FoldDesk v0.1.7</title>
<style>
  :root { --text:#fafafa; --subtle:#9a9aa0; --accent:#3e91ff; --card:#1c1c1f; --div:rgba(255,255,255,.08); --menu:#2b2b2f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1760px; height:971px; overflow:hidden; display:flex; gap:10px; background:#000; color:var(--text); font-family:"SamsungOne",Roboto,system-ui,sans-serif; }
  .screen { position:relative; width:875px; height:971px; overflow:hidden;
    background: radial-gradient(700px 520px at 78% 22%, rgba(97,150,255,.55), transparent 65%), radial-gradient(640px 520px at 20% 85%, rgba(54,196,214,.35), transparent 60%), linear-gradient(155deg,#0f2c63,#07122a); }
  .cap { position:absolute; left:14px; top:10px; font-size:13px; color:#ffd76a; background:rgba(0,0,0,.6); padding:4px 9px; border-radius:6px; z-index:9; }
  .page { position:absolute; left:40px; top:46px; width:620px; background:#0c0c0e; border-radius:14px; padding:10px 18px 18px; box-shadow:0 16px 48px rgba(0,0,0,.55); }
  .gt { font-size:13px; color:var(--accent); font-weight:600; margin:14px 12px 8px; }
  .card { background:var(--card); border-radius:22px; overflow:hidden; }
  .row { display:flex; align-items:center; padding:12px 20px; min-height:58px; font-size:15px; gap:14px; } .row + .row { border-top:1px solid var(--div); }
  .row .t { flex:1; } .row small { display:block; font-size:12.5px; margin-top:3px; color:var(--subtle); } .row small.v { color:var(--accent); }
  .dim { opacity:.45; }
  .new { font-size:10px; font-weight:700; background:var(--accent); border-radius:6px; padding:1px 5px; margin-left:6px; vertical-align:2px; }
  .sw { width:44px; height:24px; border-radius:12px; background:var(--accent); position:relative; flex:none; } .sw::after { content:""; position:absolute; right:3px; top:3px; width:18px; height:18px; border-radius:9px; background:#fff; }
  .sw.off { background:#3a3a3e; } .sw.off::after { right:auto; left:3px; background:#c8c8cc; }
  .note { position:absolute; font-size:12.5px; color:#cfe1ff; background:rgba(0,0,0,.6); padding:6px 10px; border-radius:6px; line-height:1.45; }
  /* sheet */
  .shade { position:absolute; inset:0; background:rgba(0,0,0,.45); }
  .sheet { position:absolute; left:110px; right:110px; bottom:0; top:120px; background:rgba(43,43,47,.95); backdrop-filter:blur(30px); border-radius:26px 26px 0 0; padding:10px 0 0; display:flex; flex-direction:column; }
  .grab { width:40px; height:4px; border-radius:2px; background:#5a5a60; margin:0 auto 10px; }
  .st { font-size:17px; font-weight:700; padding:4px 24px 0; } .ss { font-size:12.5px; color:var(--subtle); padding:3px 24px 10px; }
  .search { margin:4px 20px 8px; height:40px; border-radius:20px; background:rgba(255,255,255,.08); color:var(--subtle); font-size:14px; display:flex; align-items:center; padding:0 18px; }
  .sec { font-size:12.5px; color:var(--accent); font-weight:600; padding:10px 24px 4px; }
  .app { display:flex; align-items:center; gap:14px; padding:9px 24px; font-size:15px; } .app i { width:32px; height:32px; border-radius:10px; flex:none; } .app span { flex:1; }
  .ck { width:22px; height:22px; border-radius:6px; border:2px solid #8a8a90; flex:none; } .ck.on { background:var(--accent); border-color:var(--accent); position:relative; } .ck.on::after { content:"✓"; position:absolute; left:3px; top:-1px; font-size:14px; font-weight:700; color:#fff; }
  .btns { margin-top:auto; display:flex; align-items:center; border-top:1px solid var(--div); } .btns div { flex:1; text-align:center; padding:16px; font-size:15px; font-weight:600; } .btns .vd { flex:0 0 1px; height:20px; padding:0; background:#55555a; } .btns .ap { color:var(--accent); }
  /* menu */
  .ctx { position:absolute; width:250px; background:var(--menu); border-radius:22px; padding:8px 0; box-shadow:0 10px 34px rgba(0,0,0,.55); font-size:14px; }
  .ctx .head { display:flex; align-items:center; gap:10px; padding:8px 18px 10px; font-weight:600; } .ctx .head i { width:22px; height:22px; border-radius:7px; }
  .ctx hr { border:0; border-top:1px solid rgba(255,255,255,.1); margin:4px 0; }
  .ctx div.it { padding:10px 20px; display:flex; } .ctx div.it span { margin-left:auto; color:var(--subtle); } .ctx div.hl { background:rgba(255,255,255,.12); }
</style></head><body>
<div class="screen" id="a"></div><div class="screen" id="b"></div>
<script>
a.innerHTML = `<div class="cap">1 · New settings rows</div>
<div class="page">
  <div class="gt">Taskbar</div><div class="card">
    <div class="row dim"><div class="t">Auto hide taskbar<small>Hides while an app is open. Tap or swipe the handle at the edge to show it</small></div><div class="sw off"></div></div>
    <div class="row"><div class="t">Keep over full-screen apps <span class="new">NEW</span><small>Stays visible over videos and games too. It covers the bottom of the app, so some controls may be hidden under it</small></div><div class="sw off"></div></div>
  </div>
  <div class="gt">Desktop</div><div class="card">
    <div class="row"><div class="t">Hide status bar on desktop <span class="new">NEW</span><small>Clock and icons at the top are hidden while you're on the FoldDesk desktop. Apps still show it</small></div><div class="sw off"></div></div>
  </div>
  <div class="gt">App drawer</div><div class="card">
    <div class="row"><div class="t">Hidden apps <span class="new">NEW</span><small class="v">3 apps</small></div></div>
  </div>
</div>
<div class="ctx" style="left:430px;top:560px">
  <div class="head"><i style="background:#7e57c2"></i>Icon Pack Pro</div><hr>
  <div class="it">Open</div><div class="it">Open in full screen</div><div class="it">Window size <span>Default ›</span></div><hr>
  <div class="it">Pin to taskbar</div><div class="it">Add to desktop</div><div class="it hl">Hide from drawer</div><hr>
  <div class="it">App info</div>
</div>
<div class="note" style="left:40px;top:600px;width:370px">Shortcut: long press an app in the drawer → <b>Hide from drawer</b>.<br><br>Hidden apps don't show in the drawer or its search, and leave the taskbar and desktop alone (an app you pinned stays pinned).</div>`;
const apps = [['Icon Pack Pro','#7e57c2',1],['Linea Icons','#26a69a',1],['Whicons','#ec407a',1],['Browser','#1a73e8',0],['Calculator','#5f6672',0],['Calendar','#f4b400',0],['Camera','#78909c',0],['Clock','#5c6bc0',0]];
const row = ([n,c,on]) => `<div class="app"><i style="background:${c}"></i><span>${n}</span><div class="ck${on?' on':''}"></div></div>`;
b.innerHTML = `<div class="cap">2 · Settings → Hidden apps: hide or show any app</div>
<div class="page dim" style="height:600px"></div><div class="shade"></div>
<div class="sheet"><div class="grab"></div>
  <div class="st">Hidden apps</div><div class="ss">Ticked apps don't show in the app drawer</div>
  <div class="search">Search apps</div>
  <div class="sec">Hidden · 3</div>${apps.filter(x=>x[2]).map(row).join('')}
  <div class="sec">All apps</div>${apps.filter(x=>!x[2]).map(row).join('')}
  <div class="btns"><div>Cancel</div><div class="vd"></div><div class="ap">Apply</div></div>
</div>
<div class="note" style="left:130px;top:70px;width:615px">Tick to hide, untick to show again. Hidden apps are listed first; search filters both lists.</div>`;
</script></body></html>
