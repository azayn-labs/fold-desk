<!doctype html>
<html><head><meta charset="utf-8"><title>FoldDesk cover widget grid</title>
<style>
  :root { --text:#fafafa; --subtle:#9a9aa0; --accent:#3e91ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1560px; height:1220px; overflow:hidden; display:flex; gap:20px; padding:20px; background:#111; color:var(--text); font-family:"SamsungOne",Roboto,system-ui,sans-serif; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .cap { font-size:14px; color:#ffd76a; height:22px; }
  .screen { position:relative; width:480px; height:1120px; overflow:hidden; border-radius:28px;
    background: radial-gradient(500px 420px at 80% 10%, rgba(97,150,255,.30), transparent 65%), radial-gradient(500px 500px at 10% 95%, rgba(54,196,214,.22), transparent 60%), linear-gradient(170deg,#0d1730,#05080f); }
  .status { position:absolute; left:0; right:0; top:0; height:30px; display:flex; justify-content:space-between; padding:7px 22px; font-size:12.5px; color:#d8d8dc; }
  .dots { position:absolute; left:0; right:0; top:36px; display:flex; justify-content:center; gap:6px; }
  .dots i { width:6px; height:6px; border-radius:3px; background:rgba(255,255,255,.35); } .dots i.on { background:#fff; width:16px; }
  .sh { position:absolute; left:22px; right:22px; top:56px; font-size:12px; display:flex; justify-content:space-between; font-weight:500; }
  .grid { position:absolute; left:14px; top:84px; width:452px; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:146px; gap:7px; grid-auto-flow:dense; }
  .grid.lines { background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px); background-size:153px 153px; }
  .w { border-radius:22px; background:rgba(38,38,42,.72); padding:14px 16px; position:relative; overflow:visible; }
  .w.sel { outline:2px solid var(--accent); outline-offset:2px; }
  .wx { font-size:12px; color:var(--subtle); }
  .clock { display:flex; align-items:center; justify-content:center; }
  .face { width:230px; height:230px; border-radius:50%; background:#0b0b0d; position:relative; }
  .face i { position:absolute; left:50%; top:50%; background:#ddd; transform-origin:0 50%; border-radius:4px; }
  .bat { display:flex; flex-direction:column; justify-content:space-between; }
  .cell { display:flex; align-items:center; gap:8px; font-size:13px; } .cell b { margin-left:auto; font-weight:500; }
  .ring { width:30px; height:30px; border-radius:15px; border:4px solid rgba(255,255,255,.12); border-top-color:#25d366; border-right-color:#25d366; flex:none; }
  .days { display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--subtle); text-align:center; } .days b { display:block; color:var(--text); font-size:14px; font-weight:500; margin-top:3px; }
  .big { font-size:44px; font-weight:300; line-height:1.05; }
  .corner { position:absolute; right:-10px; bottom:-10px; width:26px; height:26px; border-radius:13px; background:var(--accent); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .size { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--accent); color:#fff; font-size:13px; font-weight:600; padding:4px 10px; border-radius:10px; }
  .ghost { border:2px dashed rgba(62,145,255,.7); border-radius:22px; }
  .note { font-size:12.5px; color:#cfe1ff; line-height:1.45; width:480px; }
  .add { border:2px dashed rgba(255,255,255,.25); border-radius:22px; display:flex; align-items:center; justify-content:center; color:var(--subtle); font-size:14px; }
</style></head><body>
<script>
const status = `<div class="status"><span>17:13</span><span>85%</span></div><div class="dots"><i class="on"></i><i></i><i></i></div>`;
const hand = (len, w, deg, c='#ddd') => `<i style="width:${len}px;height:${w}px;margin-top:${-w/2}px;transform:rotate(${deg}deg);background:${c}"></i>`;
const clock = (cls='') => `<div class="w clock ${cls}" style="grid-column:span 2;grid-row:span 2">${cls?'':''}<div class="face">${hand(80,10,-30)}${hand(60,12,95,'#aaa')}${hand(100,2,200,'#fff')}</div>${cls.includes('sel')?'<div class="corner">⤡</div>':''}</div>`;
const battery = `<div class="w bat" style="grid-row:span 2"><div class="wx">Batteries</div>
  <div class="cell"><div class="ring"></div>Phone<b>85%</b></div><div class="cell"><div class="ring" style="border-top-color:#3e91ff;border-right-color:#3e91ff"></div>Buds<b>60%</b></div><div class="cell"><div class="ring" style="border-top-color:#f4b400;border-right-color:#f4b400"></div>Watch<b>42%</b></div></div>`;
const weather = `<div class="w" style="grid-column:span 3;grid-row:span 2"><div style="display:flex;justify-content:space-between"><div><div class="wx">Giesing · Rain ending around 6:15 PM</div><div class="big">10°</div></div><div style="font-size:42px">🌧</div></div>
  <div class="days">${[['Wed','12° 4°'],['Thu','11° 3°'],['Fri','10° 2°'],['Sat','9° 3°']].map(([d,t])=>`<div>${d}<b>${t}</b></div>`).join('')}</div></div>`;
const small = (t,v) => `<div class="w"><div class="wx">${t}</div><div style="font-size:28px;font-weight:300;margin-top:14px">${v}</div></div>`;
const s1 = `${status}<div class="sh"><span>Widgets</span><span>Edit</span></div><div class="grid">${clock()}${battery}${weather}${small('Steps','6,420')}${small('Alarm','07:00')}${small('Notes','3 items')}</div>`;
const s2 = `${status}<div class="sh"><span>Widgets</span><span>Done</span></div><div class="grid lines">
  <div class="w clock sel" style="grid-column:span 2;grid-row:span 2;opacity:.9"><div class="face">${hand(80,10,-30)}${hand(60,12,95,'#aaa')}${hand(100,2,200,'#fff')}</div><div class="corner">⤡</div><div class="size">2 × 2</div></div>
  ${battery}${weather}<div class="add">+ Add widget</div></div>`;
const s3 = `${status}<div class="sh"><span>Widgets</span><span>Done</span></div><div class="grid lines">
  <div class="w clock sel" style="grid-column:span 3;grid-row:span 2"><div class="face" style="width:250px;height:250px">${hand(86,10,-30)}${hand(64,12,95,'#aaa')}${hand(110,2,200,'#fff')}</div><div class="corner">⤡</div><div class="size">3 × 2</div></div>
  ${battery.replace('grid-row:span 2','grid-row:span 2')}<div class="w" style="grid-column:span 2;grid-row:span 2;opacity:.55"><div class="wx">Weather moves down to make room</div></div></div>`;
const cols = [
  ['1 · Widget page on a 3-column grid', s1, 'Square cells, 3 across. Widgets are 1–3 cells wide and as many rows tall as they need, filling in left to right, top to bottom: the 2×2 clock and a 1×2 battery widget share a row, small widgets fill the gaps.'],
  ['2 · Edit mode', s2, 'Faint grid lines show the cells. The selected widget gets a corner handle; drag it to resize in both directions, snapping to cells (the size shows while dragging). Long-press menu as before: Resize, Move up / down (changes the order, the grid reflows), Widget settings, Remove.'],
  ['3 · Resizing', s3, 'Drag the corner to 3 × 2 and the clock takes the full width; whatever doesn\'t fit next to it moves down. Widgets start at the size they ask for, capped at 3 wide. Existing full-width widgets keep their place as 3-wide.'],
];
document.body.innerHTML = cols.map(([c,s,n])=>`<div class="col"><div class="cap">${c}</div><div class="screen">${s}</div><div class="note">${n}</div></div>`).join('');
</script></body></html>
