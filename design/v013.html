<!doctype html>
<html><head><meta charset="utf-8"><title>FoldDesk v0.1.3</title>
<style>
  :root { --text:#fafafa; --subtle:#9a9aa0; --accent:#3e91ff; --card:#1c1c1f; --div:rgba(255,255,255,.08); --menu:#2b2b2f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1760px; height:971px; overflow:hidden; display:flex; gap:10px; background:#000; color:var(--text); font-family:"SamsungOne",Roboto,system-ui,sans-serif; }
  .screen { position:relative; width:875px; height:971px; overflow:hidden;
    background: radial-gradient(700px 520px at 78% 22%, rgba(97,150,255,.55), transparent 65%), radial-gradient(640px 520px at 20% 85%, rgba(54,196,214,.35), transparent 60%), linear-gradient(155deg,#0f2c63,#07122a); }
  .cap { position:absolute; left:14px; top:10px; font-size:13px; color:#ffd76a; background:rgba(0,0,0,.6); padding:4px 9px; border-radius:6px; z-index:9; }
  .page { position:absolute; left:60px; top:50px; width:600px; height:600px; background:#0c0c0e; border-radius:14px; padding:14px 18px 20px; box-shadow:0 16px 48px rgba(0,0,0,.55); overflow:hidden; }
  .gt { font-size:13px; color:var(--accent); font-weight:600; margin:14px 12px 8px; }
  .card { background:var(--card); border-radius:22px; overflow:hidden; }
  .row { display:flex; align-items:center; padding:13px 20px; min-height:60px; font-size:15px; gap:14px; } .row + .row { border-top:1px solid var(--div); }
  .row .t { flex:1; } .row small { display:block; font-size:12.5px; margin-top:3px; color:var(--subtle); } .row small.v { color:var(--accent); }
  .new { font-size:10px; font-weight:700; background:var(--accent); border-radius:6px; padding:1px 5px; margin-left:6px; vertical-align:2px; }
  .sw { width:44px; height:24px; border-radius:12px; background:var(--accent); position:relative; } .sw::after { content:""; position:absolute; right:3px; top:3px; width:18px; height:18px; border-radius:9px; background:#fff; }
  .radio { width:18px; height:18px; border-radius:9px; border:2px solid #8a8a90; } .radio.on { border-color:var(--accent); background:radial-gradient(circle,var(--accent) 0 4px,transparent 5px); }
  .dim { position:absolute; left:60px; top:50px; width:600px; height:600px; border-radius:14px; background:rgba(0,0,0,.45); }
  .sheet { position:absolute; left:72px; top:318px; width:576px; background:rgba(43,43,47,.94); backdrop-filter:blur(30px); border-radius:26px; padding:10px 0 4px; box-shadow:0 -10px 30px rgba(0,0,0,.5); }
  .grab { width:40px; height:4px; border-radius:2px; background:#5a5a60; margin:0 auto 10px; }
  .st { font-size:17px; font-weight:700; padding:4px 24px 0; } .ss { font-size:12.5px; color:var(--subtle); padding:3px 24px 8px; }
  .opt { display:flex; align-items:center; gap:14px; padding:12px 24px; font-size:15px; } .opt small { color:var(--subtle); font-size:12.5px; margin-left:6px; } .opt .radio { margin-left:auto; }
  .btns { display:flex; align-items:center; margin-top:6px; } .btns div { flex:1; text-align:center; padding:14px; font-size:15px; font-weight:600; } .btns .vd { flex:0 0 1px; height:20px; padding:0; background:#55555a; } .btns .ap { color:var(--accent); }
  /* desktop + menu */
  .taskbar { position:absolute; left:0; right:0; bottom:0; height:48px; background:rgba(28,28,30,.62); backdrop-filter:blur(24px); display:flex; align-items:center; gap:8px; padding:0 10px; }
  .taskbar i { width:30px; height:30px; border-radius:9px; }
  .drawer { position:absolute; left:137px; top:150px; width:600px; height:600px; background:rgba(38,38,42,.82); backdrop-filter:blur(30px); border-radius:26px; padding:22px; }
  .search { height:40px; border-radius:20px; background:rgba(255,255,255,.08); margin-bottom:22px; color:var(--subtle); font-size:14px; display:flex; align-items:center; padding:0 18px; }
  .grid { display:grid; grid-template-columns:repeat(6,1fr); row-gap:22px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:7px; font-size:12px; } .tile i { width:52px; height:52px; border-radius:15px; }
  .tile.held i { outline:2px solid rgba(255,255,255,.7); outline-offset:3px; }
  .ctx { position:absolute; width:250px; background:var(--menu); border-radius:22px; padding:8px 0; box-shadow:0 10px 34px rgba(0,0,0,.55); font-size:14px; }
  .ctx .head { display:flex; align-items:center; gap:10px; padding:8px 18px 10px; font-weight:600; } .ctx .head i { width:22px; height:22px; border-radius:7px; }
  .ctx hr { border:0; border-top:1px solid rgba(255,255,255,.1); margin:4px 0; }
  .ctx div.it { padding:10px 20px; display:flex; } .ctx div.it span { margin-left:auto; color:var(--subtle); } .ctx div.hl { background:rgba(255,255,255,.12); }
  .sub { position:absolute; width:200px; background:var(--menu); border-radius:18px; padding:6px 0; box-shadow:0 10px 34px rgba(0,0,0,.55); font-size:14px; }
  .sub div { padding:10px 18px; display:flex; align-items:center; } .sub div small { color:var(--subtle); margin-left:6px; font-size:12px; } .sub .ck { margin-left:auto; color:var(--accent); font-weight:700; }
  .note { position:absolute; font-size:12.5px; color:#cfe1ff; background:rgba(0,0,0,.6); padding:5px 9px; border-radius:6px; }
</style></head><body>
<div class="screen" id="a"></div><div class="screen" id="b"></div>
<script>
const opt = (t, on, s='') => `<div class="opt">${t}${s?`<small>${s}</small>`:''}<div class="radio${on?' on':''}"></div></div>`;
a.innerHTML = `<div class="cap">1 · Settings → Gestures: pick what each swipe does</div>
<div class="page">
  <div class="gt">Gestures</div><div class="card">
    <div class="row"><div class="t">Swipe up on desktop <span class="new">NEW</span><small class="v">App drawer</small></div></div>
    <div class="row"><div class="t">Swipe down on desktop <span class="new">NEW</span><small class="v">Notifications</small></div></div>
    <div class="row"><div class="t">Swipe to switch desktops<small>Swipe left or right on empty desktop</small></div><div class="sw"></div></div>
    <div class="row"><div class="t">Swipe down to close app drawer<small>When the app list is scrolled to the top</small></div><div class="sw"></div></div>
  </div>
</div>
<div class="dim"></div>
<div class="sheet"><div class="grab"></div>
  <div class="st">Swipe down on desktop</div><div class="ss">On an empty part of the desktop</div>
  ${opt('App drawer',false)}${opt('Notifications',true)}${opt('Quick settings',false)}${opt('Nothing',false)}
  <div class="btns"><div>Cancel</div><div class="vd"></div><div class="ap">Apply</div></div>
</div>
<div class="note" style="left:60px;top:690px;max-width:600px">Replaces the two on/off switches. Old settings carry over (a switch that was off becomes "Nothing").<br>Same action sheet as the other pickers.</div>`;

const col = ['#1a73e8','#5f6672','#25d366','#d6249f','#1877f2','#ff0033','#f4b400','#0f9d58','#7e57c2','#ff7043','#26a69a','#ec407a','#5c6bc0','#8d6e63','#78909c','#ab47bc','#29b6f6','#9ccc65'];
const names = ['Browser','Settings','Messages','Gallery','Social','Video','Notes','Maps','Music','Photos','Calendar','Camera','Mail','Files','Clock','Store','Weather','Health'];
b.innerHTML = `<div class="cap">2 · Long press an app → Window size</div>
<div class="drawer"><div class="search">Search apps</div><div class="grid">
  ${names.map((n,i)=>`<div class="tile${i===5?' held':''}"><i style="background:${col[i]}"></i>${n}</div>`).join('')}
</div></div>
<div class="ctx" style="left:430px;top:258px">
  <div class="head"><i style="background:#ff0033"></i>Video</div><hr>
  <div class="it">Open</div><div class="it">Open in full screen</div>
  <div class="it hl">Window size <span>Large ›</span></div><hr>
  <div class="it">Move to desktop <span>›</span></div><hr>
  <div class="it">Pin to taskbar</div><div class="it">Add to desktop</div><hr>
  <div class="it">App info</div><div class="it">Uninstall</div>
</div>
<div class="sub" style="left:222px;top:358px">
  <div>Default<small>Medium</small></div><div>Small</div><div>Medium</div><div>Large<span class="ck">✓</span></div>
</div>
<div class="note" style="left:137px;top:770px;max-width:600px">Applies the next time the app opens in a window. "Default" follows Settings → New window size.<br>Same menu from the taskbar and desktop icons.</div>
<div class="taskbar">${col.slice(0,6).map(c=>`<i style="background:${c}"></i>`).join('')}</div>`;
</script></body></html>
