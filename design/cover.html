<!doctype html>
<html><head><meta charset="utf-8"><title>FoldDesk cover screen</title>
<style>
  :root { --text:#fafafa; --subtle:#9a9aa0; --accent:#3e91ff; --row:rgba(255,255,255,.06); --div:rgba(255,255,255,.08); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:2060px; height:1220px; overflow:hidden; display:flex; gap:20px; padding:20px; background:#111; color:var(--text); font-family:"SamsungOne",Roboto,system-ui,sans-serif; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .cap { font-size:14px; color:#ffd76a; height:22px; }
  .screen { position:relative; width:480px; height:1120px; overflow:hidden; border-radius:28px;
    background: radial-gradient(500px 420px at 80% 10%, rgba(97,150,255,.30), transparent 65%), radial-gradient(500px 500px at 10% 95%, rgba(54,196,214,.22), transparent 60%), linear-gradient(170deg,#0d1730,#05080f); }
  .status { position:absolute; left:0; right:0; top:0; height:30px; display:flex; justify-content:space-between; padding:7px 22px; font-size:12.5px; color:#d8d8dc; }
  .sec { padding:0 14px; display:flex; flex-direction:column; gap:6px; }
  .sh { font-size:12px; color:var(--subtle); padding:10px 8px 2px; display:flex; justify-content:space-between; }
  .row { display:flex; gap:12px; align-items:center; background:var(--row); border-radius:16px; padding:10px 12px; position:relative; overflow:hidden; }
  .row::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c); }
  .row i { width:30px; height:30px; border-radius:9px; flex:none; background:var(--c); }
  .row .b { flex:1; min-width:0; } .row .t { font-size:14px; display:flex; justify-content:space-between; } .row .t span { color:var(--subtle); font-size:12px; }
  .row .p { font-size:12.5px; color:var(--subtle); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .badge { font-size:11px; background:var(--c); color:#fff; border-radius:9px; padding:0 6px; margin-left:6px; }
  .bar { margin:10px 14px; border-radius:22px; background:rgba(38,38,42,.78); backdrop-filter:blur(30px); padding:14px 18px 10px; position:relative; box-shadow:0 6px 24px rgba(0,0,0,.35); }
  .bar .clock { font-size:54px; font-weight:300; letter-spacing:-1px; line-height:1; }
  .bar .meta { display:flex; justify-content:space-between; font-size:13px; color:var(--subtle); margin-top:6px; }
  .bar .grip { width:44px; height:4px; border-radius:2px; background:rgba(255,255,255,.35); margin:10px auto 0; }
  .ev { display:flex; gap:12px; padding:10px 12px; border-radius:16px; background:var(--row); align-items:center; }
  .ev .time { width:54px; font-size:13px; color:var(--accent); flex:none; }
  .ev .w { font-size:14px; } .ev .w small { display:block; font-size:12px; color:var(--subtle); }
  .dock { position:absolute; left:14px; right:14px; bottom:18px; display:flex; justify-content:space-around; background:rgba(38,38,42,.6); backdrop-filter:blur(24px); border-radius:24px; padding:10px; }
  .dock i { width:42px; height:42px; border-radius:13px; }
  .hint { position:absolute; right:0; top:50%; transform:translateY(-50%); width:4px; height:80px; border-radius:2px 0 0 2px; background:rgba(255,255,255,.3); }
  .note { font-size:12.5px; color:#cfe1ff; line-height:1.45; width:480px; }
  /* app list */
  .search { margin:40px 16px 10px; height:42px; border-radius:21px; background:rgba(255,255,255,.08); display:flex; align-items:center; padding:0 18px; color:var(--subtle); font-size:14px; }
  .letter { font-size:12px; color:var(--accent); padding:10px 26px 2px; }
  .app { display:flex; gap:14px; align-items:center; padding:8px 24px; font-size:15px; } .app i { width:36px; height:36px; border-radius:11px; flex:none; }
  .az { position:absolute; right:6px; top:110px; display:flex; flex-direction:column; gap:3px; font-size:10px; color:var(--subtle); text-align:center; }
  /* settings sheet */
  .dim { position:absolute; inset:0; background:rgba(0,0,0,.45); }
  .sheet { position:absolute; left:10px; right:10px; bottom:10px; background:rgba(43,43,47,.95); border-radius:26px; padding:10px 0 0; }
  .grab { width:40px; height:4px; border-radius:2px; background:#5a5a60; margin:0 auto 10px; }
  .st { font-size:17px; font-weight:700; padding:4px 22px 0; } .ss { font-size:12.5px; color:var(--subtle); padding:3px 22px 10px; }
  .opt { display:flex; align-items:center; gap:14px; padding:12px 22px; font-size:15px; } .opt i { width:30px; height:30px; border-radius:9px; flex:none; }
  .opt small { display:block; font-size:12px; color:var(--subtle); } .opt .b { flex:1; }
  .radio { width:18px; height:18px; border-radius:9px; border:2px solid #8a8a90; } .radio.on { border-color:var(--accent); background:radial-gradient(circle,var(--accent) 0 4px,transparent 5px); }
  .tag { font-size:10px; font-weight:700; background:var(--accent); border-radius:6px; padding:1px 5px; margin-left:6px; vertical-align:2px; color:#fff; }
  .btns { display:flex; border-top:1px solid var(--div); margin-top:6px; } .btns div { flex:1; text-align:center; padding:16px; font-size:15px; }
</style></head><body>
<script>
const notif = [
  ['#25d366','Messages','Sam','On my way, 10 min',2],
  ['#ea4335','Mail','Weekly report','The numbers for this week are in…',1],
  ['#1a73e8','Phone','Missed call','Alex · 12:40',0],
  ['#ff0033','Video','New upload','A channel you follow posted a video',0],
];
const notifRows = (list) => list.map(([c,app,title,prev,n]) => `<div class="row" style="--c:${c}"><i></i><div class="b"><div class="t">${title}${n?`<span class="badge">${n}</span>`:''}<span style="margin-left:auto">${app}</span></div><div class="p">${prev}</div></div></div>`).join('');
const events = [['13:30','Team sync','Room 2 · 30 min'],['16:00','Dentist','Main St 12'],['Tomorrow','Flight to Lisbon','09:45 · Terminal 1']];
const evRows = (list) => list.map(([t,w,s]) => `<div class="ev"><div class="time">${t}</div><div class="w">${w}<small>${s}</small></div></div>`).join('');
const bar = (h) => `<div class="bar"><div class="clock">12:52</div><div class="meta"><span>Wed, Oct 28</span><span>☁ 11°</span><span>84% ▮</span></div><div class="grip"></div></div>`;
const dockCols = ['#1a73e8','#25d366','#ea4335','#7e57c2','#f4b400'];
const dock = `<div class="dock">${dockCols.map(c=>`<i style="background:${c}"></i>`).join('')}</div>`;
const status = `<div class="status"><span>12:52</span><span>84%</span></div>`;

const s1 = `${status}<div style="height:34px"></div>
  <div class="sec"><div class="sh"><span>Notifications</span><span>4</span></div>${notifRows(notif)}</div>
  ${bar()}
  <div class="sec"><div class="sh"><span>Today</span><span>Calendar</span></div>${evRows(events)}</div>
  <div class="hint"></div>${dock}`;
const s2 = `${status}<div style="height:34px"></div>
  <div class="sec"><div class="sh"><span>Notifications</span><span>7</span></div>${notifRows(notif.concat([
    ['#0f9d58','Chat','Team','Lunch at 1?',3],['#ff7043','Shop','Your order','Out for delivery',0],['#5c6bc0','Bank','Payment','€12.40 at Café',0]]))}</div>
  ${bar()}
  <div class="sec"><div class="sh"><span>Today</span><span>2 more ↓</span></div>${evRows(events.slice(0,1))}</div>${dock}`;
const apps = [['A',[['Alarm','#5c6bc0'],['Authenticator','#78909c']]],['B',[['Bank','#1a73e8'],['Browser','#0f9d58']]],['C',[['Calculator','#5f6672'],['Calendar','#f4b400'],['Camera','#ff7043'],['Chat','#25d366']]],['M',[['Mail','#ea4335'],['Maps','#26a69a'],['Messages','#25d366'],['Music','#ec407a']]],['P',[['Phone','#1a73e8'],['Photos','#ab47bc']]]];
const s3 = `${status}<div class="search">Search apps</div>${apps.map(([l,list])=>`<div class="letter">${l}</div>${list.map(([n,c])=>`<div class="app"><i style="background:${c}"></i>${n}</div>`).join('')}`).join('')}
  <div class="az">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(x=>`<span>${x}</span>`).join('')}</div>`;
const s4 = `${status}<div style="height:34px"></div><div class="sec"><div class="sh"><span>Notifications</span><span>4</span></div>${notifRows(notif)}</div><div class="dim"></div>
  <div class="sheet"><div class="grab"></div><div class="st">Cover screen launcher</div><div class="ss">Used when the phone is folded</div>
    <div class="opt"><i style="background:#1a73e8"></i><div class="b">One UI Home</div><div class="radio"></div></div>
    <div class="opt"><i style="background:#26a69a"></i><div class="b">Niagara</div><div class="radio"></div></div>
    <div class="opt"><i style="background:#3e91ff"></i><div class="b">FoldDesk cover screen<span class="tag">PREVIEW</span><small>Notifications and your day at a glance</small></div><div class="radio on"></div></div>
    <div class="opt"><i style="background:#3e91ff;opacity:.6"></i><div class="b">FoldDesk desktop (both screens)</div><div class="radio"></div></div>
    <div class="btns"><div>Cancel</div></div></div>`;
const cols = [
  ['1 · Cover screen at a glance', s1, 'Notifications grouped by app on top (newest first, tap to open, swipe sideways to dismiss), the clock bar in the middle, today\'s calendar below, a small dock of pinned apps at the bottom. Swipe right anywhere for the app list (handle on the right edge).'],
  ['2 · Drag the clock bar down', s2, 'Dragging the bar gives the top section more room (or drag up for more calendar). It remembers where you left it.'],
  ['3 · Swipe right: app list', s3, 'All apps A–Z with search and a letter scroller. Swipe left or Back to return. Hidden apps stay hidden here too.'],
  ['4 · Turning it on', s4, 'One more choice in the existing Cover screen launcher sheet, marked Preview. Weather only shows if a weather app/widget provides it; otherwise that spot is left out (FoldDesk has no internet access).'],
];
document.body.innerHTML = cols.map(([c,s,n])=>`<div class="col"><div class="cap">${c}</div><div class="screen">${s}</div><div class="note">${n}</div></div>`).join('');
</script></body></html>
