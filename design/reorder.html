<!doctype html>
<html><head><meta charset="utf-8"><title>Taskbar Reorder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 560px; overflow: hidden; color: #fafafa; font-family: "SamsungOne", Roboto, system-ui, sans-serif;
    background: linear-gradient(155deg, #0f2c63 0%, #0b1b3d 55%, #07122a 100%); }
  .row { position: relative; height: 170px; border-bottom: 1px dashed rgba(255,255,255,.18); }
  .cap { position: absolute; left: 16px; top: 12px; font-size: 13px; color: #ffd76a; }
  .cap b { color: #fff; font-size: 15px; margin-right: 8px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 14px; height: 52px; background: rgba(12,12,14,.86); display: flex; align-items: center; padding: 0 10px; gap: 4px; }
  .k { width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .sep { width: 1px; height: 22px; background: rgba(255,255,255,.18); margin: 0 6px; }
  .a { width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; position: relative; transition: none; }
  .ico { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
  .gap { width: 44px; height: 40px; border-radius: 10px; border: 2px dashed rgba(62,145,255,.7); }
  .lift { position: absolute; width: 52px; height: 48px; border-radius: 12px; background: rgba(255,255,255,.2); box-shadow: 0 10px 24px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; transform: scale(1.1); }
  .finger { position: absolute; width: 30px; height: 30px; border-radius: 15px; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.7); }
  .arrow { position: absolute; font-size: 12px; color: #8fbcff; }
  .strip { position: absolute; left: 10px; bottom: 74px; display: flex; gap: 10px; padding: 8px; border-radius: 16px; background: rgba(38,38,42,.95); }
  .card { width: 120px; height: 52px; border-radius: 10px; background: linear-gradient(155deg,#1d3f86,#0b1b3d); border: 2px solid transparent; font-size: 11px; padding: 4px 6px; }
  .card.cur { border-color: #3e91ff; }
</style></head><body>
<script>
const A={ch:['#1a73e8','C'],st:['#5f6672','⚙'],wa:['#25d366','✆'],ig:['#d6249f','◎'],fb:['#1877f2','f'],yt:['#ff0033','▶']};
const ico=k=>`<div class="ico" style="background:${A[k][0]}">${A[k][1]}</div>`;
const keys=`<div class="k">⠿</div><div class="k">❐</div><div class="sep"></div>`;
const bar=items=>`<div class="bar">${keys}${items.map(k=>k==='_'?'<div class="gap"></div>':`<div class="a">${ico(k)}</div>`).join('')}</div>`;
document.body.innerHTML=`
<div class="row"><div class="cap"><b>1 · Long-press, then drag sideways</b>The icon lifts; its old spot opens up</div>
  ${bar(['ch','st','_','ig','fb','yt'])}<div class="lift" style="left:265px;bottom:34px">${ico('wa')}</div><div class="finger" style="left:276px;bottom:24px"></div></div>
<div class="row"><div class="cap"><b>2 · Other icons slide out of the way</b>Drop to place it there; the order is saved</div>
  ${bar(['ch','st','ig','fb','_','yt'])}<div class="lift" style="left:380px;bottom:34px">${ico('wa')}</div><div class="finger" style="left:391px;bottom:24px"></div>
  <div class="arrow" style="left:300px;bottom:76px">← Instagram, Facebook shift left</div></div>
<div class="row"><div class="cap"><b>3 · Drag upwards instead</b>Leaves the taskbar → desktops appear, as today (move to another desktop)</div>
  <div class="strip"><div class="card cur">Desktop 1</div><div class="card">Desktop 2</div></div>
  ${bar(['ch','st','_','ig','fb','yt'])}<div class="lift" style="left:290px;bottom:110px">${ico('wa')}</div><div class="finger" style="left:301px;bottom:100px"></div></div>`;
</script></body></html>
