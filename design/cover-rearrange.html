<!doctype html><html><head><meta charset="utf-8"><title>FoldDesk cover rearrange</title><style>
  :root { --text:#fafafa; --subtle:#9a9aa0; --accent:#3e91ff; --row:rgba(28,28,30,.55); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1560px; height:1220px; overflow:hidden; display:flex; gap:20px; padding:20px; background:#111; color:var(--text); font-family:"SamsungOne",Roboto,system-ui,sans-serif; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .cap { font-size:14px; color:#ffd76a; height:22px; }
  .screen { position:relative; width:480px; height:1120px; overflow:hidden; border-radius:28px;
    background: radial-gradient(500px 420px at 80% 10%, rgba(97,150,255,.30), transparent 65%), radial-gradient(500px 500px at 10% 95%, rgba(54,196,214,.22), transparent 60%), linear-gradient(170deg,#0d1730,#05080f); }
  .status { height:30px; display:flex; justify-content:space-between; padding:7px 22px; font-size:12.5px; color:#d8d8dc; }
  .dots { display:flex; justify-content:center; gap:6px; margin:4px 0 8px; }
  .dots i { width:6px; height:6px; border-radius:3px; background:rgba(255,255,255,.35); } .dots i.on { background:#fff; width:16px; }
  .lbl { font-size:12px; color:rgba(250,250,250,.85); padding:8px 22px 6px; font-weight:500; display:flex; justify-content:space-between; }
  .nrow { margin:0 14px 6px; height:58px; border-radius:16px; background:var(--row); display:flex; align-items:center; gap:12px; padding:0 14px; }
  .nrow i { width:30px; height:30px; border-radius:15px; background:#5f6672; flex:none; }
  .nrow span { height:10px; border-radius:5px; background:rgba(255,255,255,.18); }
  .clock { margin:10px 14px; height:112px; border-radius:22px; background:rgba(38,38,42,.78); padding:12px 20px; font-size:52px; font-weight:300; }
  .clock small { display:block; font-size:13px; color:#ccc; margin-top:2px; }
  .ev { margin:0 14px; height:44px; border-radius:14px; background:var(--row); padding:12px 16px; font-size:13px; }
  .dock { position:absolute; left:14px; right:14px; bottom:22px; height:64px; border-radius:24px; background:rgba(28,28,30,.6); display:flex; justify-content:space-evenly; align-items:center; }
  .dock i, .ic { width:44px; height:44px; border-radius:14px; display:block; }
  .dock i.lift { transform:translate(70px,-10px) scale(1.12); box-shadow:0 8px 20px rgba(0,0,0,.6); }
  .dock i.slot { background:transparent !important; border:2px dashed rgba(62,145,255,.7); }
  .ctx { position:absolute; width:230px; background:#2b2b2f; border-radius:20px; padding:6px 0; box-shadow:0 10px 34px rgba(0,0,0,.55); font-size:14px; z-index:3; }
  .ctx .h { display:flex; gap:10px; align-items:center; padding:10px 18px; font-weight:600; } .ctx .h i { width:22px; height:22px; border-radius:7px; }
  .ctx div.it { padding:11px 20px; } .ctx hr { border:0; border-top:1px solid rgba(255,255,255,.1); margin:4px 0; }
  .ctx .new { color:var(--accent); }
  .ctx .off { color:#6d6d72; } .ctx .off small { display:block; font-size:11px; margin-top:2px; }
  .panel { position:absolute; left:0; right:0; top:52px; bottom:0; background:rgba(28,28,30,.6); border-radius:24px 24px 0 0; }
  .letter { font-size:12px; color:var(--accent); padding:12px 26px 2px; }
  .app { display:flex; gap:14px; align-items:center; padding:8px 24px; font-size:15px; } .app i { width:36px; height:36px; border-radius:11px; flex:none; }
  .app.sel { background:rgba(255,255,255,.08); }
  .note { font-size:12.5px; color:#cfe1ff; line-height:1.45; width:480px; }
</style><style>
  .fav { position:absolute; left:0; right:0; bottom:100px; padding:6px 12px; }
  .fav .row { display:flex; } .fav .a { width:72px; text-align:center; font-size:11px; color:#eee; }
  .fav .a i { width:46px; height:46px; border-radius:14px; display:block; margin:0 auto 5px; }
  .arr { outline:2px dashed rgba(62,145,255,.75); outline-offset:4px; border-radius:18px; background:rgba(62,145,255,.08); }
  .arr .a i { animation:none; box-shadow:0 0 0 2px rgba(255,255,255,.12); }
  .lifted { transform:translate(36px,-14px) scale(1.12); z-index:2; position:relative; } .lifted i { box-shadow:0 10px 22px rgba(0,0,0,.6) !important; }
  .hole i { background:transparent !important; border:2px dashed rgba(62,145,255,.7); }
  .bar { position:absolute; left:14px; right:14px; display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:#cfe1ff; }
  .done { background:var(--accent); color:#fff; font-weight:600; font-size:13px; border-radius:16px; padding:7px 16px; }
  .dock.arr { outline-offset:3px; }
</style></head><body><script>
const c = ['#e53935','#1a73e8','#25d366','#f4b400','#7e57c2','#26a69a','#ff7043'];
const head = `<div class="status"><span>12:00</span><span>80%</span></div><div class="dots"><i></i><i class="on"></i><i></i></div><div class="lbl"><span>Notifications</span><span>2</span></div>`+'<div class="nrow"><i></i><span style="width:55%"></span></div>'.repeat(2)+`<div class="clock">12:00<small>Thu, Oct 29</small></div><div class="ev">09:00 &nbsp; Team standup</div>`;
const favs = (mode, bottom) => { const names=['Photos','Chat','Maps','Notes','Music','Files']; return `<div class="fav" style="bottom:${bottom||100}px"><div class="row ${mode=='fav'?'arr':''}">`+names.map((n,i)=>{let cls='a'; if(mode=='fav'&&i==1) cls+=' lifted';  return `<div class="${cls}"><i style="background:${c[(i+2)%7]}"></i>${n}</div>`}).join('')+`</div></div>`;};
const dock = (mode) => `<div class="dock ${mode=='dock'?'arr':''}">`+c.slice(0,6).map((x,i)=>{let s=`background:${x}`; let cls=''; if(mode=='dock'&&i==0) cls='lift'; if(mode=='dock'&&i==1) cls='slot'; return `<i class="${cls}" style="${s}"></i>`}).join('')+`</div>`;
const menu = `<div class="ctx" style="left:120px;bottom:200px"><div class="h"><i style="background:${c[3]}"></i>Chat</div><hr>
 <div class="it">Add to dock</div><div class="it">Remove from favourites</div><div class="it new">Rearrange favourites</div><div class="it">Hide from app list</div><hr><div class="it">App info</div><div class="it">Uninstall</div></div>`;
const s1 = head + favs('') + dock('') + menu;
const s2 = head + favs('fav') + dock('') + `<div class="bar" style="bottom:204px"><span>Drag icons to move them</span><span class="done">Done</span></div>`;
const s3 = head + favs('', 140) + dock('dock') + `<div class="bar" style="bottom:94px"><span>Drag icons to move them</span><span class="done">Done</span></div>`;
const cols = [
 ['1 · Hold a favourite (or a dock icon)', s1, 'The menu gets a new item: "Rearrange favourites" (on a dock icon it says "Rearrange dock"). Everything else in the menu stays as it is.'],
 ['2 · Rearranging favourites', s2, 'The row gets an outline and a "Done" button. Icons now move with a plain drag, no long press needed; the others slide aside to show where it lands. Taps don\'t open apps while rearranging. Done, Back or tapping elsewhere finishes. If the row scrolls, dragging to its edge scrolls it.'],
 ['3 · Rearranging the dock', s3, 'Same for the dock. The quick way keeps working too: hold an icon and drag straight away, without opening the menu.'],
];
document.body.innerHTML = cols.map(([t,s,n])=>`<div class="col"><div class="cap">${t}</div><div class="screen">${s}</div><div class="note">${n}</div></div>`).join('');
</script></body></html>
